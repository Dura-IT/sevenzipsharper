name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Compiles the full solution on Ubuntu and runs unit tests under SonarCloud
  # with OpenCover coverage. This is the only job that measures coverage.
  unit-tests:
    name: build + unit-tests + sonar (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0  # Sonar requires full history for blame and new-code detection

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5
        with:
          dotnet-version: |
            8.x
            10.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Sonar begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"Dura-IT_SevenZipSharper"
          /o:"durait"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.sourceEncoding="UTF-8"
          /d:sonar.exclusions="**/*.7z,**/*.png"
          /d:sonar.test.exclusions="**/*.7z,**/*.png"
          /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml"

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Test (unit, with coverage)
        run: >
          dotnet test tests/SevenZipSharper.UnitTests/SevenZipSharper.UnitTests.csproj
          -c Release --nologo --no-build
          --collect:"XPlat Code Coverage"
          --results-directory coverage
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Sonar end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # Compiles the full solution and runs integration tests against the real
  # native 7-Zip library on each supported OS/RID. No Sonar wrap and no
  # coverage — this matrix exists to catch cross-platform interop regressions.
  # Covers all seven shipped RIDs: linux-x64, linux-arm64, win-x64, win-arm64,
  # win-x86, osx-arm64, osx-x64. win-x86 runs as a 32-bit process under WOW64
  # on windows-latest via dotnet_arch: x86 — this is what actually exercises
  # the win-x86 PROPVARIANT stride path against the real 32-bit 7z.dll.
  integration-tests:
    name: build + integration-tests (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-x86
            dotnet_arch: x86
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
            dotnet_arch: x64
            arch_prefix: arch -x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5
        with:
          dotnet-version: |
            8.x
            10.x
          architecture: ${{ matrix.dotnet_arch }}
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Download prebuilt 7-Zip natives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(cat scripts/7zip-version)
          gh release download "natives-v$VERSION" \
            --repo "${{ github.repository }}" \
            --pattern "natives-v$VERSION.tar.gz" \
            --output natives.tar.gz
          tar xzf natives.tar.gz -C src/SevenZipSharper.Native/
          mkdir -p runtimes
          cp -r src/SevenZipSharper.Native/runtimes/. runtimes/
          rm natives.tar.gz

      - name: Build
        run: ${{ matrix.arch_prefix }} dotnet build -c Release --nologo

      - name: Test (integration)
        run: >
          ${{ matrix.arch_prefix }}
          dotnet test tests/SevenZipSharper.IntegrationTests/SevenZipSharper.IntegrationTests.csproj
          -c Release --nologo --no-build

  # ReSharper InspectCode — the same inspection engine behind Rider's live editor hints,
  # run headless. It reads the committed SevenZipSharper.sln.DotSettings and the per-project
  # .csproj.DotSettings files, so what Ben sees inline while editing is what CI enforces.
  # -e=WARNING mirrors TreatWarningsAsErrors: Warning and Error fail the job, while
  # Suggestion/Hint/Info stay advisory. Findings also land in GitHub code scanning.
  inspect-code:
    name: inspectcode (resharper)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload-sarif writes to code scanning

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      # The action installs only one SDK; the solution multi-targets net8.0 and net10.0,
      # and InspectCode builds it before analysing.
      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5
        with:
          dotnet-version: |
            8.x
            10.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Inspect code
        uses: JetBrains/ReSharper-InspectCode@96fdc3456bf2908dd877213a2644ccb9e3010785  # v0.14
        with:
          solution: SevenZipSharper.slnx
          sEverity: WARNING
          output: inspectcode.sarif.json
          upload-sarif: true
          # Keep in sync with dotnet-tools.json. A drift between the version CI installs
          # and the one `dotnet jb` runs locally silently changes which inspections fire.
          tool-version: 2026.2.1

      # InspectCode exits 0 even when it reports findings — the gate has to be explicit.
      - name: Fail on findings
        run: |
          count=$(jq '[.runs[].results[]] | length' inspectcode.sarif.json)
          echo "InspectCode findings at WARNING or above: $count"
          if [ "$count" -gt 0 ]; then
            jq -r '.runs[].results[]
                   | "\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)  [\(.ruleId)] \(.message.text)"' \
              inspectcode.sarif.json
            exit 1
          fi

  # Smoke test only — packs both nupkgs to confirm the metadata is well-formed.
  # The real release pack happens in publish.yml on tag push. Gated on both
  # test jobs so a broken managed contract or interop regression blocks pack.
  pack:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5
        with:
          dotnet-version: 10.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Pack managed library
        run: dotnet pack src/SevenZipSharper/SevenZipSharper.csproj -c Release --nologo

      - name: Pack native package
        run: dotnet pack src/SevenZipSharper.Native/SevenZipSharper.Native.csproj -c Release --nologo

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nupkg
          path: artifacts/packages/*.nupkg
